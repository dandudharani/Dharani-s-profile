<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220;
    --panel:#141d33;
    --panel-2:#101828;
    --border:#223154;
    --text:#e8ecf5;
    --muted:#7c8bab;
    --accent:#f2b84b;
    --accent-dim:rgba(242,184,75,0.14);
    --ok:#5fbf8b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(1100px 600px at 50% -10%, #16223e 0%, var(--bg) 60%);
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--text);
  }
  .scene{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* Device */
  .device{
    background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px 24px 24px;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
  }
  .device::before{
    content:"";
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    width:34px; height:4px;
    border-radius:2px;
    background:var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    margin-bottom:22px;
  }
  .brand-name{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--muted);
  }
  .brand-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 3px rgba(95,191,139,0.15);
  }

  .display-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:22px 10px 26px;
    background:radial-gradient(180px 100px at 50% 0%, var(--accent-dim), transparent 70%);
    border-radius:16px;
    margin-bottom:20px;
  }

  .ring-wrap{ position:relative; width:56px; height:56px; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--border); stroke-width:4; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round;
    transition:stroke-dashoffset 1s linear; }
  .ring-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; color:var(--muted);
  }

  .digits{
    display:flex;
    gap:8px;
  }
  .digit{
    width:38px; height:52px;
    display:flex; align-items:center; justify-content:center;
    background:#0d1626;
    border:1px solid var(--border);
    border-radius:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:26px;
    font-weight:600;
    color:var(--accent);
    text-shadow:0 0 14px rgba(242,184,75,0.35);
    font-variant-numeric:tabular-nums;
  }
  .digit.placeholder{ color:var(--border); text-shadow:none; }

  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    min-height:16px;
  }

  .generate-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#241705;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.2s ease;
    box-shadow:0 8px 20px -8px rgba(242,184,75,0.55);
  }
  .generate-btn:hover{ box-shadow:0 10px 26px -8px rgba(242,184,75,0.7); }
  .generate-btn:active{ transform:scale(0.97); }
  .generate-btn:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }

  /* Log panel */
  .log{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
  }
  .log-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .log-title{ font-size:13px; color:var(--muted); }
  .log-count{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); }
  .log-list{
    list-style:none;
    margin:0; padding:0;
    display:flex; flex-direction:column;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
  }
  .log-list li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(255,255,255,0.02);
    color:var(--text);
  }
  .log-list li .run{ color:var(--muted); }
  .log-list li .code{ color:var(--accent); }
  .log-list li .ok{ color:var(--ok); }
  .log-empty{ color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:6px 2px; }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .log-list li.new{ animation:fadeIn 0.25s ease; }

  @media (prefers-reduced-motion: reduce){
    .generate-btn, .ring-fg, .log-list li.new{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="device">
      <div class="brand">
        <span class="brand-name">SECURE ACCESS TOKEN</span>
        <span class="brand-dot" aria-hidden="true"></span>
      </div>

      <div class="display-wrap">
        <div class="ring-wrap" aria-hidden="true">
          <svg width="56" height="56">
            <circle class="ring-bg" cx="28" cy="28" r="24"></circle>
            <circle class="ring-fg" id="ring" cx="28" cy="28" r="24"
              stroke-dasharray="150.8" stroke-dashoffset="150.8"></circle>
          </svg>
          <span class="ring-label" id="ringLabel">--</span>
        </div>

        <div class="digits" id="digits" aria-live="polite" aria-label="One time password">
          <div class="digit placeholder">-</div>
          <div class="digit placeholder">-</div>
          <div class="digit placeholder">-</div>
          <div class="digit placeholder">-</div>
          <div class="digit placeholder">-</div>
          <div class="digit placeholder">-</div>
        </div>

        <div class="status-line" id="statusLine">Press generate for a new code</div>
      </div>

      <button class="generate-btn" id="generateBtn">Generate OTP</button>
    </div>

    <div class="log">
      <div class="log-header">
        <span class="log-title">Run history</span>
        <span class="log-count" id="logCount">0 runs</span>
      </div>
      <ul class="log-list" id="logList"></ul>
      <div class="log-empty" id="logEmpty">No runs yet — generate a code to see it logged here.</div>
    </div>
  </div>

<script>
  const digitsEl = document.getElementById('digits');
  const statusLine = document.getElementById('statusLine');
  const generateBtn = document.getElementById('generateBtn');
  const logList = document.getElementById('logList');
  const logEmpty = document.getElementById('logEmpty');
  const logCount = document.getElementById('logCount');
  const ring = document.getElementById('ring');
  const ringLabel = document.getElementById('ringLabel');

  const CIRCUMFERENCE = 150.8;
  const EXPIRY_SECONDS = 30;
  let runCount = 0;
  let timerInterval = null;

  function randomOtp(){
    // 6-digit OTP, always between 100000 and 999999
    return Math.floor(100000 + Math.random() * 900000);
  }

  function renderDigits(otpString, animate){
    const boxes = digitsEl.querySelectorAll('.digit');
    boxes.forEach((box, i) => {
      box.classList.remove('placeholder');
      if(!animate){
        box.textContent = otpString[i];
        return;
      }
      let ticks = 0;
      const maxTicks = 6 + i * 2;
      const roll = setInterval(() => {
        box.textContent = Math.floor(Math.random() * 10);
        ticks++;
        if(ticks >= maxTicks){
          clearInterval(roll);
          box.textContent = otpString[i];
        }
      }, 35);
    });
  }

  function startExpiry(){
    clearInterval(timerInterval);
    let remaining = EXPIRY_SECONDS;
    ringLabel.textContent = remaining;
    ring.style.strokeDashoffset = 0;
    statusLine.textContent = 'Code active — expires in ' + remaining + 's';

    timerInterval = setInterval(() => {
      remaining--;
      const offset = CIRCUMFERENCE * (1 - remaining / EXPIRY_SECONDS);
      ring.style.strokeDashoffset = offset;
      ringLabel.textContent = remaining > 0 ? remaining : '0';

      if(remaining <= 0){
        clearInterval(timerInterval);
        statusLine.textContent = 'Code expired — generate a new one';
      } else {
        statusLine.textContent = 'Code active — expires in ' + remaining + 's';
      }
    }, 1000);
  }

  function logRun(otp){
    runCount++;
    logEmpty.style.display = 'none';

    const li = document.createElement('li');
    li.classList.add('new');
    li.innerHTML =
      '<span class="run">Run ' + String(runCount).padStart(2, '0') + '</span>' +
      '<span class="code">' + otp + '</span>' +
      '<span class="ok">6 digits ✓</span>';

    logList.prepend(li);

    // keep the visible history compact
    while(logList.children.length > 6){
      logList.removeChild(logList.lastChild);
    }
    logCount.textContent = runCount + (runCount === 1 ? ' run' : ' runs');
  }

  generateBtn.addEventListener('click', () => {
    const otp = randomOtp().toString();
    renderDigits(otp, true);
    startExpiry();
    logRun(otp);
  });
</script>
</body>
</html>
